spring.application.name=InvoiceService

server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/spring_profile_invoice
spring.datasource.username=root
spring.datasource.password=adminzzzzzzzzzzzzzzzzzzz

# Recommended Properties
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# Eureka Server URL
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Register this service with Eureka
eureka.client.register-with-eureka=true

# Fetch service registry from Eureka
eureka.client.fetch-registry=true
